<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>EV Charging Station Finder &middot; India</title>
<meta name="description" content="Find EV charging stations across India by city, pincode or your current location. Data from Open Charge Map." />
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<link rel="stylesheet" href="styles.css" />
</head>
<body>

<!-- ============================ LOGIN ============================ -->
<section id="loginView" class="view">
  <div class="login-card">
    <div class="brand">
      <svg viewBox="0 0 24 24" width="34" height="34" aria-hidden="true">
        <path fill="currentColor" d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12l1-8.5z"/>
      </svg>
    </div>
    <h1>EV Charging Station Finder</h1>
    <p class="sub">India &middot; <span id="stationCountLogin">1,872</span> charging stations</p>

    <!-- step 1 -->
    <form id="mobileForm" class="step" autocomplete="off">
      <label for="mobile">Mobile number</label>
      <div class="phone-field">
        <span class="cc">+91</span>
        <input id="mobile" type="tel" inputmode="numeric" maxlength="14" placeholder="98765 43210" aria-label="Mobile number" />
      </div>
      <button type="submit" class="primary" id="sendOtpBtn">Send OTP</button>
    </form>

    <!-- step 2 -->
    <form id="otpForm" class="step hidden" autocomplete="off">
      <label for="otp">Enter the 6-digit code sent to <b id="otpTo"></b></label>
      <input id="otp" type="tel" inputmode="numeric" maxlength="6" placeholder="000000" aria-label="One time code" />
      <button type="submit" class="primary" id="verifyBtn">Verify &amp; continue</button>
      <div class="row">
        <button type="button" class="link" id="changeNumberBtn">Change number</button>
        <button type="button" class="link" id="resendBtn">Resend code</button>
      </div>
    </form>

    <div id="loginMsg" class="msg" role="status" aria-live="polite"></div>
    <div id="devNotice" class="dev-notice hidden"></div>

    <p class="fine">
      We use your number only to verify you. Data: Open Charge Map (open data).
    </p>
  </div>
</section>

<!-- ============================ APP ============================ -->
<section id="appView" class="view hidden">
  <header class="topbar">
    <div class="brand-sm">
      <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
        <path fill="currentColor" d="M13 2 4.5 13.5H11l-1 8.5 8.5-11.5H12l1-8.5z"/>
      </svg>
      <span>EV Charging Finder</span>
    </div>
    <div class="topbar-right">
      <span id="whoami" class="who"></span>
      <button id="logoutBtn" class="link">Log out</button>
    </div>
  </header>

  <div class="searchbar">
    <input id="q" type="search" placeholder="City, area, pincode or station name &mdash; e.g. Kochi, 560066, Statiq" aria-label="Search location" />
    <button id="searchBtn" class="primary">Search</button>
    <button id="geoBtn" class="ghost" title="Use my current location">
      <svg viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path fill="currentColor" d="M12 8a4 4 0 100 8 4 4 0 000-8zm9 3h-2.06A7 7 0 0013 5.06V3h-2v2.06A7 7 0 005.06 11H3v2h2.06A7 7 0 0011 18.94V21h2v-2.06A7 7 0 0018.94 13H21v-2z"/></svg>
      Use my location
    </button>
  </div>

  <div class="filters">
    <label>Within
      <select id="radius">
        <option value="5">5 km</option>
        <option value="10">10 km</option>
        <option value="25" selected>25 km</option>
        <option value="50">50 km</option>
        <option value="100">100 km</option>
        <option value="5000">Anywhere in India</option>
      </select>
    </label>
    <label>Connector
      <select id="connector">
        <option value="">Any</option>
        <option value="CCS (Type 2)">CCS (Type 2)</option>
        <option value="CHAdeMO">CHAdeMO</option>
        <option value="Type 2">Type 2</option>
        <option value="GB-T">GB-T</option>
        <option value="IEC 60309">IEC 60309</option>
      </select>
    </label>
    <label>Payment
      <select id="payment">
        <option value="">Any</option>
        <option value="public">Public</option>
        <option value="pay">Pay at location</option>
        <option value="membership">Membership required</option>
        <option value="private">Private / restricted</option>
      </select>
    </label>
    <label class="check"><input type="checkbox" id="fastOnly" /> Fast charging only</label>
    <button id="resetBtn" class="link">Reset</button>
  </div>

  <div id="status" class="status">Logging you in&hellip;</div>

  <div class="body">
    <aside id="list" class="list" aria-label="Results"></aside>
    <div id="map"></div>
  </div>
</section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="app.js"></script>
</body>
</html>
