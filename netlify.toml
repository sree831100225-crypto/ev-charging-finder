[build]
  publish = "docs"
  functions = "netlify/functions"

# Clean API paths: /api/stations -> /.netlify/functions/stations
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/:splat"
  status = 200
  force = true

# In api mode the dataset must only be served by stations.js after login, so
# block the static copy that static mode (GitHub Pages) uses.
[[redirects]]
  from = "/data/*"
  to = "/404.html"
  status = 404
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
